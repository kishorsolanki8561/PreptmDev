@if (!skipSmall() && (srcWidth() < 600 || onlyLow())) {
  <img [class]="className()"
    [src]="srcLow()" width="360" height="180"
    [attr.loading]="priority() ? 'eager' : 'lazy'"
    [attr.fetchpriority]="priority() ? 'high' : 'auto'"
    [alt]="alt()"
    (error)="onImgError($event)"
    (click)="openPreview()">
} @else if (srcWidth() < 1024 || onlyMedium()) {
  <img [class]="className()"
    [src]="srcMedium()" width="360" height="180"
    [attr.loading]="priority() ? 'eager' : 'lazy'"
    [attr.fetchpriority]="priority() ? 'high' : 'auto'"
    [alt]="alt()"
    (error)="onImgError($event)"
    (click)="openPreview()">
} @else {
  <img [class]="className()"
    [src]="srcHigh()" width="1200" height="628"
    [attr.loading]="priority() ? 'eager' : 'lazy'"
    [attr.fetchpriority]="priority() ? 'high' : 'auto'"
    [alt]="alt()"
    (error)="onImgError($event)"
    (click)="openPreview()">
}

<!-- Lightbox preview (only when showPreview=true and user clicked) -->
@if (previewOpen()) {
  <div class="fixed inset-0 z-[9998] flex items-center justify-center bg-black/80 cursor-zoom-out"
       (click)="closePreview()">
    <img [src]="srcHigh()" [alt]="alt()"
      class="max-w-[90vw] max-h-[90vh] object-contain rounded-xl shadow-2xl cursor-default"
      (click)="$event.stopPropagation()">
    <button class="absolute top-4 right-4 text-white bg-black/50 rounded-full p-2
                   hover:bg-black/70 transition-colors"
            aria-label="Close preview"
            (click)="closePreview()">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>
}
