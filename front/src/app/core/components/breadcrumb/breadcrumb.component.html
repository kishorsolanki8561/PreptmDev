<nav aria-label="Breadcrumb"
  class="breadcrumb-wrapper lg:mx-0 overflow-x-auto"
  itemscope itemtype="https://schema.org/BreadcrumbList">
  <ol class="flex items-center gap-1 flex-nowrap">

    @if (breadcrumb() && breadcrumb().length && breadcrumb()[0].text) {
      <li class="flex items-center gap-1 flex-shrink-0"
          itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
        <a itemprop="item" [routerLink]="['/']"
           class="text-gray-600 hover:text-gray-400 text-sm transition-colors">
          <span itemprop="name" i18n>Home</span>
        </a>
        <meta itemprop="position" content="1" />
        <span class="text-neutral-300 select-none text-sm" aria-hidden="true">›</span>
      </li>
    }

    @for (item of breadcrumb(); track $index; let i = $index; let last = $last) {
      <li class="flex items-center gap-1 flex-shrink-0"
          itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
        @if (item.path) {
          <a itemprop="item" [routerLink]="item.path"
             class="text-gray-600 hover:text-gray-400 text-sm transition-colors">
            <span itemprop="name">{{item.text}}</span>
          </a>
        } @else {
          <span itemprop="name" class="current text-sm">{{item.text}}</span>
        }
        <meta itemprop="position" [content]="i + 2" />
        @if (!last) {
          <span class="text-neutral-300 select-none text-sm" aria-hidden="true">›</span>
        }
      </li>
    }

  </ol>
</nav>
