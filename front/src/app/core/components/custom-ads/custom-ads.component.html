<a (click)="joinWhatsApp()"
  class="flex items-center gap-3 bg-white border border-neutral-200 rounded-xl p-3 cursor-pointer
         hover:shadow-card-hover hover:border-green-200 transition-all duration-200 group">

  <!-- WhatsApp icon -->
  <div class="flex-shrink-0 h-10 w-10 rounded-lg bg-green-50 flex items-center justify-center">
    <img src="assets/img/WhatsApp.svg" alt="WhatsApp" width="24" height="24"
      class="h-6 w-6" [attr.loading]="'lazy'">
  </div>

  <!-- Text -->
  <div class="flex-1 min-w-0">
    <p class="text-xs font-bold text-neutral-800 leading-snug group-hover:text-green-700 transition-colors">
      Join WhatsApp Group
    </p>
    <p class="text-[11px] text-neutral-500 mt-0.5 leading-tight">
      Get free govt job alerts instantly
    </p>
  </div>

  <!-- Arrow -->
  <svg class="h-4 w-4 text-green-500 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
  </svg>
</a>
