<div class="relative w-full">

  <!-- Trigger -->
  <button type="button"
    (click)="toggle()"
    [disabled]="disabled()"
    class="w-full flex items-center justify-between gap-1.5 px-3 py-1.5 text-sm
           bg-white border border-neutral-200 rounded-lg
           hover:border-neutral-300 focus:outline-none focus:ring-1 focus:ring-brand-500
           focus:border-brand-500 disabled:opacity-50 disabled:cursor-not-allowed
           transition-colors text-left min-h-[32px]">
    <span class="truncate flex-1"
          [class]="selectedLabel() ? 'text-neutral-800' : 'text-neutral-400'">
      {{ selectedLabel() ?? placeholder() }}
    </span>
    <span class="flex items-center gap-0.5 flex-shrink-0 ml-1">
      @if (allowClear() && selectedLabel()) {
        <span (click)="clear($event)"
          class="text-neutral-400 hover:text-neutral-700 transition-colors p-0.5 rounded">
          <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </span>
      }
      <svg class="h-3.5 w-3.5 text-neutral-400 transition-transform duration-150"
           [class.rotate-180]="isOpen()"
           fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </span>
  </button>

  <!-- Dropdown panel -->
  @if (isOpen()) {
    <div class="absolute z-50 mt-1 w-full min-w-[160px] bg-white border border-neutral-200
                rounded-xl shadow-lg overflow-hidden">

      <!-- Search input -->
      <div class="p-2 border-b border-neutral-100">
        <input
          [value]="searchQuery()"
          (input)="onSearchInput($event)"
          i18n-placeholder placeholder="Search…"
          class="w-full text-sm px-2.5 py-1.5 bg-neutral-50 border border-neutral-200 rounded-lg
                 focus:outline-none focus:ring-1 focus:ring-brand-500 focus:border-brand-500
                 placeholder-neutral-400">
      </div>

      <!-- Options list -->
      <ul class="max-h-48 overflow-y-auto py-1" role="listbox">
        @if (!filteredOptions().length) {
          <li class="px-3 py-2 text-sm text-neutral-400 text-center" i18n>No results</li>
        }
        @for (opt of filteredOptions(); track opt.value) {
          <li (click)="select(opt.value)"
            role="option"
            [attr.aria-selected]="opt.value === value()"
            class="flex items-center gap-2 px-3 py-1.5 text-sm cursor-pointer transition-colors"
            [class]="opt.value === value()
              ? 'bg-brand-50 text-brand-700 font-medium'
              : 'text-neutral-700 hover:bg-neutral-50'">
            @if (opt.value === value()) {
              <svg class="h-3.5 w-3.5 text-brand-600 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
              </svg>
            } @else {
              <span class="h-3.5 w-3.5 flex-shrink-0"></span>
            }
            <span class="truncate">{{ opt.text }}</span>
          </li>
        }
      </ul>
    </div>
  }
</div>
