# Catch-all — drops requests that don't match any server_name.
#
# WHY THIS EXISTS:
#   Without a default_server, Nginx falls back to the first alphabetically
#   loaded config when a Host header doesn't match any server block.
#   This causes the "old site appearing on new URL" problem: a new subdomain
#   points to the server before its own Nginx block is active, and visitors
#   see whichever site happens to load first.
#
#   This block claims default_server on both 80 and 443 and silently drops
#   the connection (return 444), so no existing site leaks onto unknown hosts.
#
# Install FIRST — before enabling any site configs:
#   sudo cp 00-catch-all.conf /etc/nginx/sites-available/00-catch-all
#   sudo ln -sf /etc/nginx/sites-available/00-catch-all /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # remove the Nginx default page
#   sudo nginx -t && sudo systemctl reload nginx
#
# Self-signed cert for the HTTPS block (TLS handshake must complete before
# Nginx can read the SNI / Host header to decide to drop it):
#   sudo openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
#     -keyout /etc/ssl/private/nginx-catch-all.key \
#     -out    /etc/ssl/certs/nginx-catch-all.crt  \
#     -subj   "/CN=catch-all"

server {
    listen 80  default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/ssl/certs/nginx-catch-all.crt;
    ssl_certificate_key /etc/ssl/private/nginx-catch-all.key;

    return 444;
}
