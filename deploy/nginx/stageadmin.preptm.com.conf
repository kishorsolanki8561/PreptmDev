# stageadmin.preptm.com — Angular 14 SPA (static files served directly)
#
# Install:
#   sudo cp stageadmin.preptm.com.conf /etc/nginx/sites-available/stageadmin.preptm.com
#   sudo ln -sf /etc/nginx/sites-available/stageadmin.preptm.com /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d stageadmin.preptm.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name stageadmin.preptm.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stageadmin.preptm.com;

    # SSL — populated by Certbot
    ssl_certificate     /etc/letsencrypt/live/stageadmin.preptm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stageadmin.preptm.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Static files served from here (rsync target in deploy-stage-admin.yml)
    root  /home/ubuntu/preptm/Admin/Stage;
    index index.html;

    # Gzip
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/stageadmin.preptm.com.access.log;
    error_log  /var/log/nginx/stageadmin.preptm.com.error.log;

    # Hashed JS/CSS/fonts — 1 year immutable cache
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp|map)$ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Angular router — serve index.html for all app routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
