# sfile.preptm.com — File Upload Service
#
# Serves uploaded content files directly via Nginx and
# proxies API calls to FileUploaderMicroService (:5129).
#
# Install:
#   sudo cp sfile.preptm.com.conf /etc/nginx/sites-available/sfile.preptm.com
#   sudo ln -sf /etc/nginx/sites-available/sfile.preptm.com /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d sfile.preptm.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name sfile.preptm.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sfile.preptm.com;

    # SSL — populated by Certbot
    ssl_certificate     /etc/letsencrypt/live/sfile.preptm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sfile.preptm.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Logs
    access_log /var/log/nginx/sfile.preptm.com.access.log;
    error_log  /var/log/nginx/sfile.preptm.com.error.log;

    # Max upload size
    client_max_body_size 100M;

    # Gzip
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain application/json application/javascript;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;

    # CORS — allow all stage origins to fetch files
    add_header Access-Control-Allow-Origin  "https://stage.preptm.com" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS"        always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

    # Serve uploaded files directly from Content folder
    location /Content/ {
        alias /home/administrator/preptm/BackEnd/Stage/FileUploaderMicroService/Content/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Proxy API calls to FileUploaderMicroService
    location /api/ {
        proxy_pass         http://127.0.0.1:5129/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
