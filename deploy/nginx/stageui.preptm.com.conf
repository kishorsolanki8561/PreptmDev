# stageui.preptm.com — Angular 19 SSR  (Node.js port 4003 via PM2)
#
# Install:
#   sudo cp stageui.preptm.com.conf /etc/nginx/sites-available/stageui.preptm.com
#   sudo ln -sf /etc/nginx/sites-available/stageui.preptm.com /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d stageui.preptm.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name stageui.preptm.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stageui.preptm.com;

    # SSL — populated by Certbot
    ssl_certificate     /etc/letsencrypt/live/stageui.preptm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stageui.preptm.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip — compress proxied responses before sending to browser
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/x-font-ttf font/opentype image/svg+xml;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection       "1; mode=block"                   always;

    access_log /var/log/nginx/stageui.preptm.com.access.log;
    error_log  /var/log/nginx/stageui.preptm.com.error.log;

    # Proxy everything to the Angular SSR Express server.
    # proxy-server.mjs handles both EN and HI locales on one port.
    # express.static() inside it sets Cache-Control: max-age=31536000 for
    # hashed JS/CSS/font assets — browsers will cache them for a year.
    location / {
        proxy_pass         http://127.0.0.1:4003;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Strip Accept-Encoding so Nginx (not Node) handles compression
        proxy_set_header Accept-Encoding   "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        proxy_buffer_size          16k;
        proxy_buffers              4 32k;
        proxy_busy_buffers_size    64k;
    }
}
