# stage.preptm.com — Angular SSR Frontend (Node.js / PM2 port 4003)
#
# Install:
#   sudo cp stage.preptm.com.conf /etc/nginx/sites-available/stage.preptm.com
#   sudo ln -sf /etc/nginx/sites-available/stage.preptm.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name stage.preptm.com;
    server_tokens off;

    # Logs
    access_log /var/log/nginx/stage.preptm.com.access.log;
    error_log  /var/log/nginx/stage.preptm.com.error.log;

    # Gzip
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/x-font-ttf font/opentype image/svg+xml;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection       "1; mode=block"                   always;

    # Proxy to Angular SSR (PM2 on port 4003)
    location / {
        proxy_pass         http://127.0.0.1:4003;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Accept-Encoding   "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        proxy_buffer_size       16k;
        proxy_buffers           4 32k;
        proxy_busy_buffers_size 64k;
    }
}
