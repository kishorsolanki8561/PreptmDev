name: Deploy — Stage Frontend (SSR)

on:
  push:
    branches: [main]
    paths:
      - 'front/**'
      - '.github/workflows/deploy-stage-front.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    # Runs directly on your Ubuntu server — no SSH keys or rsync needed.
    # The runner agent connects out to GitHub; nothing connects in.
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Build staging
        working-directory: front
        run: npm run build:stage

      - name: Deploy to staging directory
        run: |
          rsync -a --delete \
            front/dist/preptm/ \
            "$HOME/preptm/FrontEnd/Stage/client/preptm/"

      - name: Reload SSR process (zero-downtime)
        run: cd "$HOME" && pm2 reload StageFront --update-env && pm2 save
