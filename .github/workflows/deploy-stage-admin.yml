name: Deploy — Stage Admin Panel

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/deploy-stage-admin.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Build staging
        working-directory: admin
        run: npm run buildProd:staging

      - name: Deploy to staging directory
        run: |
          rsync -a --delete \
            admin/dist/new5-gstudy/ \
            "$HOME/preptm/Admin/Stage/"
