name: Deploy — Stage Backend (.NET 6)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-stage-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      # max-parallel: 1 — a single runner handles one job at a time by default,
      # so concurrent matrix jobs queue up automatically; no explicit limit needed.
      matrix:
        include:
          # systemd: exact service name on your server.
          # Find them with: systemctl list-units --type=service | grep preptm
          - service: Gateway
            project: backend/5GStudyGateway/Gateway.csproj
            systemd: preptm-gateway

          - service: FrontMicroService
            project: backend/FrontMicroService/FrontMicroService.csproj
            systemd: preptm-front-api

          - service: MasterMicroService
            project: backend/MasterMicroService/MasterMicroService.csproj
            systemd: preptm-master-api

          - service: AllDropDownMicroService
            project: backend/AllDropDownMicroService/AllDropDownMicroService.csproj
            systemd: preptm-dropdown-api

          - service: FileUploaderMicroService
            project: backend/FileUploaderMicroService/FileUploaderMicroService.csproj
            systemd: preptm-fileupload-api

          - service: TranslationMicroService
            project: backend/TranslationMicroService/TranslationMicroService.csproj
            systemd: preptm-translation-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.x'

      - name: Publish ${{ matrix.service }}
        run: |
          dotnet publish ${{ matrix.project }} \
            -c Release \
            -o publish/${{ matrix.service }} \
            --no-self-contained

      - name: Stop service
        run: sudo systemctl stop ${{ matrix.systemd }} || true

      - name: Deploy to staging directory
        # appsettings*.json excluded — server keeps its own credentials in place
        run: |
          rsync -a --delete \
            --exclude='appsettings*.json' \
            --exclude='*.pfx' \
            publish/${{ matrix.service }}/ \
            "$HOME/preptm/Backend/Stage/${{ matrix.service }}/"

      - name: Start service
        run: sudo systemctl start ${{ matrix.systemd }}
